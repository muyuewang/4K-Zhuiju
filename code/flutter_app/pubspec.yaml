name: zhuiju
description: 4K追剧 — 高清影视聚合客户端（Android / Windows）
publish_to: 'none'
version: 1.11.5+30

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  pointycastle: ^3.7.3
  video_player: ^2.8.2
  # Windows 的播放内核 —— 这里换过一次，改动原因记在这，别再换回去：
  #
  # 原来用 video_player_win，它底层是系统的 **Media Foundation**。
  # MF 的 HLS 解析器是个「能跑但不健全」的实现，实测三类片源全废：
  #   1. 相对地址分片 + 含百分号编码的基址 → 拼错，报 file not found
  #   2. `#EXT-X-KEY:METHOD=AES-128` 加密流 → 完全不支持，黑屏
  #   3. 多级 master/variant 清单 → 展开不了，一直转圈
  # 而 Android 端一直是好的（ExoPlayer 原生支持这三样），于是长期存在
  # 「APK 能播、Windows 播不了」这个顽固现象。
  #
  # 现在换成 video_player_media_kit：它把 video_player 在 Windows 下的
  # **平台实现**整个替换成 media_kit（libmpv + FFmpeg）。关键好处是
  # 业务代码一行都不用改——player_page 里仍然只写 VideoPlayerController，
  # 但底下跑的是 FFmpeg，和 PotPlayer / 浏览器同一套解析逻辑。
  # 上面那三类问题因此一次性消失，也不需要我们自己写 AES 解密。
  video_player_media_kit: ^2.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  # **只装 Windows 的预编译库**（libmpv-2.dll + ANGLE），不装全平台的
  # `media_kit_libs_video`。后者是个 meta 包，会顺带把 android/ios/macos/
  # linux 的 libmpv 全部拉进依赖树；而我们只在 Windows 用这个内核
  # （Android 仍是 ExoPlayer），那些库会被原样打进 APK，纯属白胖几十兆。
  media_kit_libs_windows_video: ^1.0.11
  # 直接依赖，不再只当传递依赖用：core/mpv_proxy_env.dart 要靠它调
  # UCRT 的 `_putenv_s`，把系统代理写进**进程环境变量**，
  # 这样 libmpv（FFmpeg 网络栈）自己就会走代理，桌面端不必再中转视频流。
  ffi: ^2.1.0
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2

# 升级 Windows 端 FFmpeg 的唯一可行路径：vendoring。
#
# 为什么必须 override：FFmpeg 的版本**不由这里的版本号决定**，而是由
# `media_kit_libs_windows_video` 的 `windows/CMakeLists.txt` 里硬编码的
# libmpv 归档决定的：
#
#     set(LIBMPV "mpv-dev-x86_64-20230924-git-652a1dd.7z")   ← FFmpeg n6.0
#
# 而 pub 上这个包最新就是 1.0.11（我们原本就在用），上游
# `media-kit/libmpv-win32-video-build` 的 release 列表也只到 2023-09-24。
# 也就是说：**把 `^1.0.11` 改成更高的号，什么都不会发生**，因为根本没有
# 更高的版本。想换 FFmpeg 只能接管这个包的构建脚本。
#
# 所以把包复制进 `packages/media_kit_libs_windows_video`，改归档地址指向
# shinchiro 的官方 Windows 构建（FFmpeg N-128766 / mpv v0.42.0-38）。
#
# 注意：**不要改成直接改 ~/AppData/Local/Pub/Cache 下的那份**。那样本地
# 能编过，但 CI 全新 checkout 时缓存不存在，会重新拉 pub 上的 1.0.11，
# 静默退回 FFmpeg n6.0 —— 而且失败方式是完全无声的，只是版本悄悄变旧。
dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true