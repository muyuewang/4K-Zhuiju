name: zhuiju
description: 4K追剧 — 高清影视聚合客户端（Android / Windows）
publish_to: 'none'
version: 1.2.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  pointycastle: ^3.7.3
  video_player: ^2.8.2
  # video_player 官方只实现了 Android/iOS/macOS/web。
  # Windows 由这个插件补上（它 implements: video_player，
  # 所以业务代码里仍然只用 video_player 的 API，不需要 if/else 分平台）。
  video_player_win: ^3.3.1
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true